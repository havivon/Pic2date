name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch Tesseract trained data (Hebrew + English)
        run: |
          set -e
          mkdir -p app/src/main/assets/tessdata
          base="https://github.com/tesseract-ocr/tessdata_fast/raw/main"
          curl -fSL -o app/src/main/assets/tessdata/eng.traineddata "$base/eng.traineddata"
          curl -fSL -o app/src/main/assets/tessdata/heb.traineddata "$base/heb.traineddata"
          curl -fSL -o app/src/main/assets/tessdata/osd.traineddata "$base/osd.traineddata"
          ls -lh app/src/main/assets/tessdata

      - name: Run parser unit tests
        run: ./gradlew :parser:test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pic2date-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Publish the built APK to a dedicated branch so it can be pulled over git
      # (Actions artifacts are served from a host some networks block).
      - name: Publish APK to apk-latest branch
        if: github.ref == 'refs/heads/claude/pic2date-android-app-cy8qmd'
        run: |
          set -e
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "Publishing $APK"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-latest
          git reset
          cp "$APK" pic2date-debug.apk
          git add -f pic2date-debug.apk
          git commit -m "APK build for ${GITHUB_SHA}"
          git push -f origin apk-latest
